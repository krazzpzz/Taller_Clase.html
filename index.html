<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Formulario de Registro</title>
</head>
<body>

<form action="#" method="post">

<fieldset>
<legend>Datos Personales</legend>

<label for="nombre">Nombre completo:</label>
<input type="text" id="nombre" name="nombre" required minlength="3" maxlength="50">

<label for="email">Correo:</label>
<input type="email" id="email" name="email" required>

<label for="password">Contraseña:</label>
<input type="password" id="password" name="password" required minlength="8">

<label for="telefono">Teléfono:</label>
<input type="tel" id="telefono" name="telefono" required pattern="[0-9]{10}" placeholder="3001234567">

<label for="edad">Edad:</label>
<input type="number" id="edad" name="edad" required min="18" max="100">

<label for="fecha">Fecha de nacimiento:</label>
<input type="date" id="fecha" name="fecha" required>



<label for="ciudad">Ciudad:</label>
<input list="ciudades" id="ciudad" name="ciudad" required>
<datalist id="ciudades">
<option value="Bogotá">
<option value="Medellín">
<option value="Cali">
<option value="Barranquilla">
</datalist>

</fieldset>

<fieldset>
<legend>Perfil</legend>

<label for="usuario">Nombre de usuario:</label>
<input type="text" id="usuario" name="usuario" required pattern="[A-Za-z0-9]{4,12}" title="4 a 12 letras o números">



</fieldset>

<button type="submit">Registrarse</button>
<button type="reset">Borrar</button>

</form>

</body>
</html>
